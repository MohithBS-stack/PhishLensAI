name: PostgreSQL Integration Tests

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  postgres-integration:
    name: PostgreSQL 16 Integration & Migration Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: phishlens_test
          POSTGRES_USER: phishlens_user
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phishlens_user -d phishlens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic upgrade, downgrade, and re-upgrade cycle on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://phishlens_user:test_password_123@localhost:5432/phishlens_test
        run: |
          cd backend
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Run backend test suite and PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://phishlens_user:test_password_123@localhost:5432/phishlens_test
          JWT_SECRET_KEY: test-key-at-least-32-chars-long-for-testing!
          ENVIRONMENT: testing
        run: |
          cd backend
          python -m pytest -v
